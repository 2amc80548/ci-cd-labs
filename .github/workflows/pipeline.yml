name: Pipeline CI con Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Compilar y Probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias
        working-directory: ./app
        run: ./mvnw clean test

      - name: Guardar Reporte de Pruebas (Artefacto)
        if: always() # Esto hace que se guarde el reporte incluso si falla
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: app/target/surefire-reports/